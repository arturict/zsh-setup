# Managed by devhub / arturict/zsh-setup.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string '#H · #S · #{pane_current_path}'

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind s choose-tree -Zw

set -g status-position bottom
set -g status-interval 2
set -g status-style 'bg=#11111b,fg=#cdd6f4'
set -g status-left-length 80
set -g status-right-length 120
set -g status-left '#[bold,bg=#89b4fa,fg=#11111b]  #H  #[bg=#313244,fg=#cdd6f4]  #S  '
set -g window-status-format '#[fg=#7f849c] #I:#W '
set -g window-status-current-format '#[bold,bg=#cba6f7,fg=#11111b] #I:#W '
set -g status-right '#[fg=#a6adc8]#{pane_current_path}  #[fg=#a6e3a1]#{?client_prefix,PREFIX ,}#[fg=#f9e2af]%H:%M '
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#f9e2af,fg=#11111b,bold'
setw -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
